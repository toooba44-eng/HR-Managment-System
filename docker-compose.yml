services:
  backend:
    build:
      context: ./backend
    image: quant-hr-backend
    container_name: quant-hr-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-quant_hr_super_secret_key_2026_change_in_production}
      JWT_EXPIRE: 7d
      DATABASE_PATH: /app/database/hr_system.db
      SEED_DB: ${SEED_DB:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 200
    volumes:
      - hr-db:/app/database
      - hr-uploads:/app/uploads
    expose:
      - "5000"
    networks:
      - quant-hr

  frontend:
    build:
      context: ./frontend
    image: quant-hr-frontend
    container_name: quant-hr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - quant-hr

volumes:
  hr-db:
  hr-uploads:

networks:
  quant-hr:
    driver: bridge
