name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend · lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: Backend · install & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Smoke test (boot server & hit /api/health)
        env:
          NODE_ENV: development
          PORT: 5000
          DATABASE_PATH: ./database/ci.db
        run: |
          node src/server.js &
          SERVER_PID=$!
          # Wait for the server to become healthy (max ~20s)
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "✅ Server healthy"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:5000/api/health || (echo "❌ Health check failed" && kill $SERVER_PID && exit 1)
          # Verify login works end-to-end
          curl -sf -X POST http://localhost:5000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@quant.com","password":"admin123"}' | grep -q token \
            && echo "✅ Login works" || (echo "❌ Login failed" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID

  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: quant-hr-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: quant-hr-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
